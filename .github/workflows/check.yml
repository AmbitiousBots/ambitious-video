name: check

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in .mise.toml (jdx/mise-action v5.2.8)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785
        with:
          version: 2026.11.8
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the pinned Python packages
        run: "python -m pip install --require-hashes --only-binary :all: --requirement scripts/dev-requirements.txt"
      - name: Renderer check
        run: bash verify/run
      - name: Standalone check
        run: node scripts/check-standalone.mjs
      - name: Dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement scripts/dev-requirements.txt --progress-spinner off --disable-pip
