schemaVersion: 1
output: { path: out/ambitious-marketing.mp4, width: 1920, height: 1080, fps: 30 }
brand:
  font: Inter
  colors: { bg: "#0B0B0B", fg: "#FFFFFF", accent: "#3B82F6" }
  logo: assets/logo.png
voice: { provider: xai, voice: default }
tracks:
  - id: main
    clips:
      - { type: title_card, duration: 3.0, text: "Ambitious", subtitle: "Bots that are set up well and watched over" }
      - type: screen_recording
        url: "https://ambitiousbots.com"
        duration: 8.0
        actions:
          - { wait: 1.5 }
          - { scroll: 600 }
          - { wait: 1.0 }
          - { scroll: 600 }
      - { type: title_card, duration: 2.5, text: "A free bot template" }
      - type: screen_recording
        url: "https://ambitiousbots.com"
        duration: 6.0
        actions:
          - { click: "a[href*='template']" }
          - { wait: 2.0 }
          - { scroll: 400 }
      - { type: video, path: assets/modules-at-work.mp4, in: 2.0, out: 6.0 }
      - { type: title_card, duration: 2.5, text: "Monitoring with human review" }
      - { type: image, path: assets/monthly-report.png, duration: 4.0, kenburns: { from: 1.0, to: 1.08 } }
      - { type: title_card, duration: 3.0, text: "Ambitious", subtitle: "ambitiousbots.com" }
  - id: voice
    clips:
      - { type: voiceover, at: 0.5, text: "Ambitious sets up your bot and keeps watch over it." }
      - { type: voiceover, at: 3.5, text: "Start with the free Ambitious Bot template. It gives your bot clear instructions and a set of open-source tools it runs by itself." }
      - { type: voiceover, at: 14.0, text: "Each tool does one job from the command line, with no screens to click through." }
      - { type: voiceover, at: 24.5, text: "With monitoring, every organisation pays one flat monthly price, and a person reviews what the bot did." }
      - { type: voiceover, at: 30.5, text: "Find out more at ambitious bots dot com." }
  - id: captions
    from: voice
  - id: music
    clips:
      - { type: audio, path: assets/music-bed.mp3, at: 0, gain_db: -18, duck_under: voice }
cuts:
  - { at: 3.0, transition: crossfade, duration: 0.4 }
  - { at: 19.5, transition: crossfade, duration: 0.4 }
  - { at: 30.0, transition: crossfade, duration: 0.4 }
