# Written by the expand command. Change the template or the inputs, then run it again.
schemaVersion: 2
template: {id: announcement, templateVersion: 1}
budget: {maxUsd: 5}
disclosure: AI-generated scenes
output: {path: out/example-fitness.mp4, width: 1080, height: 1920, fps: 30}
brand:
  colors: {bg: '#1B1B2F', fg: '#FFFFFF', accent: '#E4572E'}
  logo: assets/logo.png
tracks:
- id: main
  clips:
  - {type: title_card, duration: 2.5, text: Example Fitness Studio, subtitle: SAMPLE DATA}
  - type: image
    path: assets/still-1.png
    duration: 3.0
    kenburns: {from: 1.0, to: 1.12}
  - {type: title_card, duration: 2.0, text: New morning classes}
  - type: image
    path: assets/still-2.png
    duration: 3.0
    kenburns: {from: 1.12, to: 1.0}
  - {type: image, path: assets/still-3.png, duration: 3.0}
  - {type: title_card, duration: 2.5, text: First class free, subtitle: fitness.example.com}
- id: voice
  clips:
  - {type: voiceover, at: 0.3, duration: 2.0, text: Start the day stronger.}
  - {type: voiceover, at: 2.8, duration: 2.5, text: 'Small groups, so the coach knows your name.'}
  - {type: voiceover, at: 7.8, duration: 2.5, text: New classes at six and seven every weekday.}
  - {type: voiceover, at: 10.8, duration: 2.5, text: All levels are welcome.}
  - {type: voiceover, at: 13.8, duration: 2.0, text: Your first class is free.}
- {id: captions, from: voice}
cuts:
- {at: 2.5, transition: crossfade, duration: 0.3}
- {at: 7.5, transition: crossfade, duration: 0.3}
- {at: 13.5, transition: crossfade, duration: 0.3}
