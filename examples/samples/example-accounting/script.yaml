# SAMPLE DATA. Example Accounting Office is a fictional business.
schemaVersion: 1
output: { path: out/example-accounting.mp4, width: 1920, height: 1080, fps: 30 }
brand:
  colors: { bg: "#1F2933", fg: "#F5F1E8", accent: "#C9A227" }
  logo: assets/logo.png
tracks:
  - id: main
    clips:
      - { type: title_card, duration: 3.0, text: "Example Accounting Office", subtitle: "Books and tax returns (SAMPLE DATA)" }
      - { type: title_card, duration: 2.5, text: "Three things we take off your desk" }
      - { type: image, path: assets/still-1.png, duration: 3.5, kenburns: { from: 1.0, to: 1.05 } }
      - { type: image, path: assets/still-2.png, duration: 3.5, kenburns: { from: 1.0, to: 1.05 } }
      - { type: image, path: assets/still-3.png, duration: 3.5, kenburns: { from: 1.0, to: 1.05 } }
      - { type: title_card, duration: 3.0, text: "Ask for a first meeting", subtitle: "accounting.example.com" }
  - id: voice
    clips:
      - { type: voiceover, at: 0.5, duration: 2.0, text: "Numbers in order, all year round." }
      - { type: voiceover, at: 5.5, duration: 3.0, text: "One: monthly bookkeeping, checked by a person." }
      - { type: voiceover, at: 9.0, duration: 3.0, text: "Two: payroll that goes out on time." }
      - { type: voiceover, at: 12.5, duration: 3.0, text: "Three: tax returns filed before the deadline." }
      - { type: voiceover, at: 16.5, duration: 2.0, text: "The first meeting is free." }
  - id: captions
    from: voice
