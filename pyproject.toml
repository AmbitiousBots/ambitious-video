[project]
name = "ambitious-video"
version = "0.1.1"
description = "A video renderer driven by a script written as data"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["pillow==13.0.0", "PyYAML==6.0.4"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor"]
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py", "*.test.py"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = true
mypy_path = "src:vendor"

[[tool.mypy.overrides]]
module = ["yaml", "playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ambitious_video.steps.*",
    "ambitious_video.steps.common",
    "ambitious_video.media.film",
]
disable_error_code = ["attr-defined", "no-any-return", "valid-type"]
